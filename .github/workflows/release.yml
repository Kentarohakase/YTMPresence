name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # web-ext und seine npm-Abhängigkeiten laufen auf einem eigenen Runner ohne
  # Schreibrechte. Im Release-Job könnte ein kompromittiertes Paket Setup und
  # SHA256SUMS.txt vor dem Veröffentlichen austauschen; der In-App-Updater
  # vertraut genau diesen beiden Dateien.
  lint-extension:
    name: Lint packaged extension
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Package extension archives
        shell: pwsh
        run: ./scripts/package-release.ps1 -SelfContained -SkipInstaller

      - name: Verify extension archives
        shell: pwsh
        run: ./scripts/verify-extension-archives.ps1

      - name: Lint packaged extension (web-ext)
        shell: pwsh
        run: npx --yes web-ext lint --source-dir artifacts/release/archive-check/YTMPresence-extension-firefox

  release:
    name: Build and publish release
    needs: lint-extension
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Kein Schritt pusht; das Token soll nicht in .git/config liegen.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test extension behavior
        run: node --test

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup."
          }

          "INNO_SETUP_COMPILER=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath "YTMPresence/extension/manifest.json" -Raw | ConvertFrom-Json
          "value=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Werte aus Tag und Manifest kommen über env statt ${{ }} ins Skript:
      # Ein Tagname wie "v1.0.0$(...)" würde sonst in einem PowerShell-String
      # in doppelten Anführungszeichen ausgeführt.
      - name: Check tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:EXPECTED_TAG
          $actual = $env:ACTUAL_TAG
          if ($actual -ne $expected) {
            throw "Tag '$actual' does not match manifest version '$expected'."
          }

      # Ein Release wird nur aus einem grünen Build mit grünen Tests gebaut.
      - name: Restore
        run: dotnet restore YTMPresence.slnx

      - name: Build (Release)
        run: dotnet build YTMPresence.slnx -c Release --no-restore

      - name: Test
        run: dotnet test YTMPresence.Core.Tests/YTMPresence.Core.Tests.csproj -c Release --no-build

      # Self-contained: Setup und ZIP bringen .NET mit, damit die App auch
      # ohne installierte Desktop- und ASP.NET-Core-Runtime startet.
      - name: Package release
        shell: pwsh
        run: ./scripts/package-release.ps1 -SelfContained -InnoSetupCompiler "$env:INNO_SETUP_COMPILER"

      # Dieselben Prüfungen wie in CI: Ein Tag darf kein Archiv
      # veröffentlichen, das CI abgelehnt hätte. Der web-ext-Lint läuft im
      # Job lint-extension, von dem dieser Job abhängt.
      - name: Verify extension archives
        shell: pwsh
        run: ./scripts/verify-extension-archives.ps1

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $version = $env:RELEASE_VERSION
          $notesPath = "artifacts/release/GITHUB_RELEASE_NOTES.md"
          $changelog = Get-Content -LiteralPath "CHANGELOG.md" -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\r?\n## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if ($match.Success) {
            $notes = $match.Value.Trim()
          } else {
            $notes = "Release $version"
          }

          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: YTMPresence-${{ steps.version.outputs.value }}-release
          path: |
            artifacts/release/YTMPresence-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/release/YTMPresence-${{ steps.version.outputs.value }}-win-x64-setup.exe
            artifacts/release/YTMPresence-extension.zip
            artifacts/release/YTMPresence-extension-firefox.zip
            artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $tag = $env:RELEASE_TAG
          $repo = $env:RELEASE_REPO
          $version = $env:RELEASE_VERSION
          $bundle = "artifacts/release/YTMPresence-$version-win-x64.zip"
          $setup = "artifacts/release/YTMPresence-$version-win-x64-setup.exe"
          $extension = "artifacts/release/YTMPresence-extension.zip"
          $extensionFirefox = "artifacts/release/YTMPresence-extension-firefox.zip"
          $checksums = "artifacts/release/SHA256SUMS.txt"
          $notes = "artifacts/release/GITHUB_RELEASE_NOTES.md"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $bundle $setup $extension $extensionFirefox $checksums --repo $repo --clobber
            gh release edit $tag --repo $repo --title "YTMPresence $version" --notes-file $notes
          } else {
            gh release create $tag $bundle $setup $extension $extensionFirefox $checksums --repo $repo --target $env:RELEASE_SHA --title "YTMPresence $version" --notes-file $notes
          }
